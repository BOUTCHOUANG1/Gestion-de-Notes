spring.application.name=ManageNotes
# Configuration du serveur
server.port=${SERVER_PORT:3030}

# database configuration (secrets externalized)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/managerNotes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${DB_PASSWORD:}

# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_THRESHOLD:60000}

# Configuration JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/managerNotes}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
# Accept either JWT_SECRET_BASE64 (preferred) or legacy JWT_SECRET
app.jwtSecret=${JWT_SECRET_BASE64:${JWT_SECRET:}}
app.jwtSecretAlgorithm=HS256
# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration (if needed)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security Configuration
spring.security.enabled=true
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
app.jwtCookie=SpringAppJwtCookie

# Logging Configuration - Only show important logs
logging.level.root=WARN
logging.level.com.university.ManageNotes=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.university.ManageNotes.security=DEBUG
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.config.import=optional:file:.env[.properties]
